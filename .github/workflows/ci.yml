name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Pruebas (pytest)
        run: pytest -q
